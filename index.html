<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survei Pembelajaran SD Xaverius 2 Jambi T.A. 2025/2026</title>
  
  <!-- CSS Pendukung (Tailwind CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Pustaka React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Kompiler Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes scaleUp {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scale-up {
      animation: scaleUp 0.3s ease-out forwards;
    }
    @media print {
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-50">

  <div id="root"></div>

  <!-- KODE UTAMA APLIKASI SURVEI & DASHBOARD -->
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // KELAS-KELAS STANDAR UNTUK DROPDOWN LOGIN
    const STANDARD_CLASSES = [
      "Kelas 1A", "Kelas 1B", "Kelas 1C",
      "Kelas 2A", "Kelas 2B", "Kelas 2C",
      "Kelas 3A", "Kelas 3B", "Kelas 3C",
      "Kelas 4A", "Kelas 4B", "Kelas 4C",
      "Kelas 5A", "Kelas 5B", "Kelas 5C",
      "Kelas 6A", "Kelas 6B", "Kelas 6C"
    ];

    // KONFIGURASI PERTANYAAN SURVEI PEMBELAJARAN
    const INITIAL_QUESTIONS = [
      {
        id: 1,
        key: 'q1',
        title: 'Bagaimana penilaian Bapak/Ibu mengenai kualitas dan kejelasan penjelasan materi oleh guru kelas?',
        type: 'radio',
        options: [
          'Sangat Jelas dan Mudah Dipahami',
          'Cukup Jelas',
          'Kurang Jelas'
        ]
      },
      {
        id: 2,
        key: 'q2',
        title: 'Bagaimana perhatian dan bantuan guru kelas ketika anak Bapak/Ibu mengalami kesulitan belajar?',
        type: 'radio',
        options: [
          'Sangat perhatian dan cepat membantu',
          'Cukup perhatian',
          'Kurang perhatian'
        ]
      },
      {
        id: 3,
        key: 'q3',
        title: 'Apakah variasi metode pembelajaran yang digunakan guru di kelas menarik minat belajar anak?',
        type: 'radio',
        options: [
          'Sangat menarik dan menyenangkan',
          'Cukup menarik',
          'Membosankan/kurang menarik'
        ]
      },
      {
        id: 4,
        key: 'q4',
        title: 'Bagaimana ketersediaan, kelayakan, dan kemudahan akses buku pelajaran serta modul pendukung di kelas?',
        type: 'radio',
        options: [
          'Sangat lengkap dan mudah diakses',
          'Cukup memadai',
          'Kurang memadai'
        ]
      },
      {
        id: 5,
        key: 'q5',
        title: 'Bagaimana objektivitas, keterbukaan, dan keadilan guru kelas dalam memberikan penilaian/nilai evaluasi?',
        type: 'radio',
        options: [
          'Sangat adil dan transparan',
          'Cukup objektif',
          'Kurang transparan dan subjektif'
        ]
      },
      {
        id: 6,
        key: 'q6',
        title: 'Bagaimana tanggapan Bapak/Ibu mengenai beban tugas sekolah (PR) yang diberikan guru kepada anak?',
        type: 'radio',
        options: [
          'Sangat proporsional dan membantu belajar mandiri',
          'Kadang terlalu banyak',
          'Terlalu banyak dan memberatkan anak'
        ]
      },
      {
        id: 7,
        key: 'q7',
        title: 'Kendala utama yang paling sering dihadapi anak dalam mengikuti pembelajaran kelas? (Pilih maksimal 2)',
        type: 'checkbox',
        maxOptions: 2,
        options: [
          'Materi pelajaran dirasa terlalu sulit',
          'Anak kurang konsentrasi di kelas',
          'Waktu belajar mandiri di rumah sangat terbatas',
          'Keterbatasan fasilitas/sarana belajar anak'
        ]
      },
      {
        id: 8,
        key: 'q8',
        title: 'Media komunikasi yang paling efektif untuk memantau perkembangan belajar anak Anda?',
        type: 'radio',
        options: [
          'Buku penghubung/Agenda harian',
          'Grup WhatsApp kelas bersama guru',
          'Aplikasi sekolah/LMS',
          'Pertemuan tatap muka berkala'
        ]
      },
      {
        id: 9,
        key: 'q9',
        title: 'Apakah pembelajaran di SD Xaverius 2 Jambi telah berhasil membantu pembentukan karakter positif anak?',
        type: 'radio',
        options: [
          'Ya, sangat terlihat perkembangannya',
          'Cukup berkembang',
          'Belum terlihat perubahan nyata'
        ]
      },
      {
        id: 10,
        key: 'q10',
        title: 'Saran, harapan, dan masukan konstruktif untuk peningkatan mutu pembelajaran di kelas:',
        type: 'textarea',
        placeholder: 'Tuliskan aspirasi, harapan belajar, atau masukan membangun Anda untuk kemajuan proses pembelajaran anak...'
      }
    ];

    const DEFAULT_ADMIN_PIN = "2026";

    // FUNGSI UTAMA INTEGRASI GEMINI API DENGAN EXPONENTIAL BACKOFF
    const callGeminiAPI = async (prompt, systemPrompt = "") => {
      const apiKey = ""; // API Key otomatis dideteksi dari lingkungan runtime
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{ parts: [{ text: prompt }] }]
      };
      if (systemPrompt) {
        payload.systemInstruction = { parts: [{ text: systemPrompt }] };
      }

      let delay = 1000;
      for (let i = 0; i < 5; i++) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "Tidak ada respon dari AI.";
          }
        } catch (err) {
          // Melakukan retry secara senyap tanpa merusak fungsionalitas konsol
        }
        await new Promise(resolve => setTimeout(resolve, delay));
        delay *= 2;
      }
      throw new Error("Gagal menghubungi AI setelah 5 kali percobaan. Silakan periksa koneksi internet Anda atau coba lagi nanti.");
    };

    function App() {
      const [activeTab, setActiveTab] = useState('survey');

      // STATE UTAMA DENGAN KEY SPESIFIK UNTUK MENGHINDARI BENTROK CACHE
      const [responses, setResponses] = useState(() => {
        const saved = localStorage.getItem('xaverius_pembelajaran_2025_responses');
        return saved ? JSON.parse(saved) : [];
      });

      const [questions, setQuestions] = useState(() => {
        const saved = localStorage.getItem('xaverius_pembelajaran_2025_questions');
        return saved ? JSON.parse(saved) : INITIAL_QUESTIONS;
      });

      const [adminPin, setAdminPin] = useState(() => {
        const saved = localStorage.getItem('xaverius_pembelajaran_2025_admin_pin');
        return saved ? saved : DEFAULT_ADMIN_PIN;
      });

      // STATE UNTUK FITUR INTEGRASI GEMINI AI
      const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
      const [aiAnalysisResult, setAiAnalysisResult] = useState(() => {
        return localStorage.getItem('xaverius_ai_analysis_result') || "";
      });
      const [isAiGeneratingProgram, setIsAiGeneratingProgram] = useState(false);
      const [selectedProgramToGenerate, setSelectedProgramToGenerate] = useState("");
      const [aiProgramPlan, setAiProgramPlan] = useState("");

      // SINCRONISASI KEDUA SECARA BERKALA
      useEffect(() => {
        localStorage.setItem('xaverius_pembelajaran_2025_responses', JSON.stringify(responses));
      }, [responses]);

      useEffect(() => {
        localStorage.setItem('xaverius_pembelajaran_2025_questions', JSON.stringify(questions));
      }, [questions]);

      useEffect(() => {
        localStorage.setItem('xaverius_ai_analysis_result', aiAnalysisResult);
      }, [aiAnalysisResult]);

      const [loginKelas, setLoginKelas] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [passcode, setPasscode] = useState('');
      const [passcodeError, setPasscodeError] = useState('');
      const [adminSubTab, setAdminSubTab] = useState('statistics'); 
      const [isOnScreenPrintPreview, setIsOnScreenPrintPreview] = useState(false);
      const [currentStep, setCurrentStep] = useState(1);
      const [currentParent, setCurrentParent] = useState(null); 
      
      const [formData, setFormData] = useState({
        q1: '', q2: '', q3: '', q4: '', q5: '', q6: '', q7: [], q8: '', q9: '', q10: ''
      });
      const [surveySubmitted, setSurveySubmitted] = useState(false);
      const [validationError, setValidationError] = useState('');

      // State Admin Kelola Pertanyaan
      const [editingQuestionId, setEditingQuestionId] = useState(null);
      const [editQuestionTitle, setEditQuestionTitle] = useState('');
      const [editQuestionOptions, setEditQuestionOptions] = useState([]);
      const [newOptionText, setNewOptionText] = useState('');
      const [customAlert, setCustomAlert] = useState(null); 
      
      const showCustomAlert = (msg) => {
        setCustomAlert(msg);
      };
      
      const [showConfirmDelete, setShowConfirmDelete] = useState(false);

      // State Tambah Pertanyaan
      const [showAddQuestionForm, setShowAddQuestionForm] = useState(false);
      const [newQuestionTitle, setNewQuestionTitle] = useState('');
      const [newQuestionType, setNewQuestionType] = useState('radio'); 
      const [newQuestionOptions, setNewQuestionOptions] = useState(['Opsi 1', 'Opsi 2']);

      const [newPinInput, setNewPinInput] = useState('');

      const totalSteps = questions.length;

      // FORMATTER SEDERHANA UNTUK MERENDER TEKS MARKDOWN DARI GEMINI AI
      const renderMarkdown = (text) => {
        if (!text) return null;
        let html = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.*?)\*/g, "<em>$1</em>")
          .replace(/^\s*\*\s+(.*?)$/gm, "<li class='ml-4 list-disc text-slate-700 my-1'>$1</li>")
          .replace(/\n/g, "<br />");
        return <div className="text-xs leading-relaxed text-slate-700 whitespace-pre-line" dangerouslySetInnerHTML={{ __html: html }} />;
      };

      // FUNGSI UNTUK PEMANGGILAN ANALISIS ASPIRASI DENGAN AI (GEMINI)
      const handleAnalyzeAspirationsWithAI = async () => {
        const aspirations = responses.filter(r => r.q10 && r.q10.trim() !== '').map(r => `[Kelas ${r.kelas}]: ${r.q10}`);
        if (aspirations.length === 0) {
          showCustomAlert("Belum ada saran/aspirasi tertulis dari wali murid untuk dianalisis oleh AI.");
          return;
        }

        setIsAiAnalyzing(true);
        const promptText = `
Berikut adalah daftar aspirasi/saran pembelajaran yang diisi oleh orang tua murid SD Xaverius 2 Jambi:
${aspirations.join("\n")}

Tolong lakukan analisis komparatif dan berikan laporan yang terstruktur dengan format:
1. **Analisis Sentimen Umum**: Bagaimana respon/emosi orang tua (Positif, Netral, atau Butuh Perhatian Khusus).
2. **Topik Utama / Masalah Terbanyak**: Sebutkan 3 topik yang paling sering dikeluhkan atau disarankan.
3. **Usulan Solusi Praktis untuk SD Xaverius 2 Jambi**: Rekomendasi tindakan nyata yang dapat diambil oleh Kepala Sekolah atau yayasan.

Berikan jawaban yang ramah, profesional, dan dalam bahasa Indonesia yang baik dan benar.
`;

        const systemPrompt = "Anda adalah seorang Asisten Konsultan Pendidikan Profesional di bawah naungan Yayasan Xaverius Palembang yang membantu sekolah melakukan analisis data mutu pembelajaran sekolah.";

        try {
          const resultText = await callGeminiAPI(promptText, systemPrompt);
          setAiAnalysisResult(resultText);
          showCustomAlert("✨ Analisis Aspirasi Berbasis AI berhasil diperbarui secara langsung!");
        } catch (err) {
          showCustomAlert(err.message);
        } finally {
          setIsAiAnalyzing(false);
        }
      };

      // FUNGSI UNTUK MERANCANG IMPLEMENTASI PROGRAM BERBASIS AI
      const handleGenerateProgramImplementation = async (programName, programDesc) => {
        setIsAiGeneratingProgram(true);
        setSelectedProgramToGenerate(programName);

        const promptText = `
Rancanglah rencana kerja pelaksanaan (implementation roadmap) untuk program sekolah berikut:
Nama Program: ${programName}
Deskripsi Singkat: ${programDesc}

Lokasi: SD Xaverius 2 Jambi
Target: Tahun Ajaran 2025/2026

Susunlah program detail yang mencakup:
1. **Tahap Persiapan (Milestones awal & Sosialisasi)**
2. **Langkah-Langkah Eksekusi (Langkah teknis mingguan/bulanan)**
3. **Parameter Keberhasilan (Indikator keberhasilan)**
4. **Metode Kolaborasi Orang Tua (Bagaimana melibatkan peran wali murid)**

Berikan draf yang taktis, kreatif, bernafaskan nilai-nilai humanis Katolik/Yayasan Xaverius Palembang, serta mudah direalisasikan di Kota Jambi.
`;

        const systemPrompt = "Anda adalah desainer kurikulum dan penasihat strategis sekolah dasar Katolik yang berpengalaman.";

        try {
          const resultText = await callGeminiAPI(promptText, systemPrompt);
          setAiProgramPlan(resultText);
        } catch (err) {
          showCustomAlert(err.message);
        } finally {
          setIsAiGeneratingProgram(false);
        }
      };

      const stats = useMemo(() => {
        const total = responses.length;
        const initialStats = {};

        questions.forEach(q => {
          initialStats[q.key] = {};
          if (q.type !== 'textarea' && q.options) {
            q.options.forEach(opt => {
              initialStats[q.key][opt] = 0;
            });
          }
        });

        responses.forEach(res => {
          questions.forEach(q => {
            if (q.type === 'radio') {
              const val = res[q.key];
              if (val && initialStats[q.key]) {
                initialStats[q.key][val] = (initialStats[q.key][val] || 0) + 1;
              }
            } else if (q.type === 'checkbox') {
              const arr = res[q.key];
              if (Array.isArray(arr) && initialStats[q.key]) {
                arr.forEach(val => {
                  initialStats[q.key][val] = (initialStats[q.key][val] || 0) + 1;
                });
              }
            }
          });
        });

        return { total, data: initialStats };
      }, [responses, questions]);

      const handleParentLogin = (e) => {
        if (e) e.preventDefault();
        setLoginError('');

        if (!loginKelas) {
          setLoginError('Silakan pilih Kelas anak Bapak/Ibu terlebih dahulu.');
          return;
        }

        setCurrentParent({ kelas: loginKelas });
        setFormData(prev => ({
          ...prev,
          kelas: loginKelas
        }));
      };

      const handleParentLogout = () => {
        setCurrentParent(null);
        setLoginKelas('');
        resetSurvey();
      };

      const handleRadioChange = (key, value) => {
        setValidationError('');
        setFormData(prev => ({ ...prev, [key]: value }));
      };

      const handleCheckboxChange = (key, option, maxAllowed) => {
        setValidationError('');
        setFormData(prev => {
          const currentSelected = prev[key] || [];
          if (currentSelected.includes(option)) {
            return {
              ...prev,
              [key]: currentSelected.filter(item => item !== option)
            };
          } else {
            if (currentSelected.length >= maxAllowed) {
              setValidationError(`Batas maksimal pengisian adalah ${maxAllowed} aspek kendala.`);
              return prev;
            }
            return {
              ...prev,
              [key]: [...currentSelected, option]
            };
          }
        });
      };

      const handleTextChange = (key, value) => {
        setFormData(prev => ({ ...prev, [key]: value }));
      };

      const handleNext = () => {
        const currentQuestion = questions[currentStep - 1];
        const answer = formData[currentQuestion.key];

        if (currentQuestion.type === 'radio' && !answer) {
          setValidationError('Silakan pilih salah satu jawaban terlebih dahulu.');
          return;
        }
        if (currentQuestion.type === 'checkbox' && (!answer || answer.length === 0)) {
          setValidationError('Silakan pilih minimal 1 jawaban (maksimal 2).');
          return;
        }

        setValidationError('');
        if (currentStep < totalSteps) {
          setCurrentStep(prev => prev + 1);
        }
      };

      const handlePrev = () => {
        setValidationError('');
        if (currentStep > 1) {
          setCurrentStep(prev => prev - 1);
        }
      };

      const handleSubmitSurvey = (e) => {
        if (e) e.preventDefault();
        
        const newResponse = { 
          ...formData, 
          kelas: currentParent.kelas, 
          timestamp: Date.now() 
        };
        
        const updatedResponses = [newResponse, ...responses];
        setResponses(updatedResponses);
        localStorage.setItem('xaverius_pembelajaran_2025_responses', JSON.stringify(updatedResponses));
        
        setSurveySubmitted(true);
      };

      const resetSurvey = () => {
        setFormData({
          q1: '', q2: '', q3: '', q4: '', q5: '', q6: '', q7: [], q8: '', q9: '', q10: ''
        });
        setCurrentStep(1);
        setSurveySubmitted(false);
        setValidationError('');
      };

      const handleAdminAccess = (e) => {
        if (e) e.preventDefault();
        if (passcode === adminPin) {
          setIsAdminUnlocked(true);
          setPasscodeError('');
        } else {
          setPasscodeError('PIN salah! Silakan periksa kembali PIN Anda.');
        }
      };

      const handleUpdatePin = (e) => {
        if (e) e.preventDefault();
        const cleanPin = newPinInput.trim();
        if (cleanPin.length < 4) {
          showCustomAlert('PIN keamanan baru minimal harus terdiri dari 4 karakter.');
          return;
        }
        setAdminPin(cleanPin);
        localStorage.setItem('xaverius_pembelajaran_2025_admin_pin', cleanPin);
        setNewPinInput('');
        showCustomAlert(`PIN keamanan berhasil diperbarui menjadi: ${cleanPin}`);
      };

      const handleLogoutAdmin = () => {
        setIsAdminUnlocked(false);
        setPasscode('');
        setActiveTab('survey');
      };

      const startEditingQuestion = (q) => {
        setEditingQuestionId(q.id);
        setEditQuestionTitle(q.title);
        setEditQuestionOptions(q.options ? [...q.options] : []);
        setNewOptionText('');
      };

      const saveEditedQuestion = () => {
        if (!editQuestionTitle.trim()) {
          showCustomAlert('Judul pertanyaan tidak boleh kosong.');
          return;
        }
        
        setQuestions(prev => prev.map(q => {
          if (q.id === editingQuestionId) {
            return {
              ...q,
              title: editQuestionTitle,
              options: q.type !== 'textarea' ? editQuestionOptions : undefined
            };
          }
          return q;
        }));

        setEditingQuestionId(null);
        showCustomAlert('Pertanyaan berhasil diperbarui!');
      };

      const addOptionToEdit = () => {
        if (!newOptionText.trim()) return;
        if (editQuestionOptions.includes(newOptionText.trim())) {
          showCustomAlert('Opsi tersebut sudah terdaftar.');
          return;
        }
        setEditQuestionOptions(prev => [...prev, newOptionText.trim()]);
        setNewOptionText('');
      };

      const deleteOptionFromEdit = (indexToDelete) => {
        setEditQuestionOptions(prev => prev.filter((_, idx) => idx !== indexToDelete));
      };

      const handleAddNewQuestion = () => {
        if (!newQuestionTitle.trim()) {
          showCustomAlert('Judul pertanyaan baru wajib diisi.');
          return;
        }

        const nextId = questions.length + 1;
        const nextKey = `q${nextId}`;

        const newQ = {
          id: nextId,
          key: nextKey,
          title: newQuestionTitle,
          type: newQuestionType,
          options: newQuestionType !== 'textarea' ? newQuestionOptions : undefined,
          maxOptions: newQuestionType === 'checkbox' ? 2 : undefined
        };

        setQuestions(prev => [...prev, newQ]);
        setFormData(prev => ({ ...prev, [nextKey]: newQuestionType === 'checkbox' ? [] : '' }));

        setNewQuestionTitle('');
        setNewQuestionType('radio');
        setNewQuestionOptions(['Opsi 1', 'Opsi 2']);
        setShowAddQuestionForm(false);
        showCustomAlert('Pertanyaan baru berhasil ditambahkan!');
      };

      const handleClearAllResponses = () => {
        setResponses([]);
        setAiAnalysisResult("");
        localStorage.setItem('xaverius_pembelajaran_2025_responses', JSON.stringify([]));
        localStorage.removeItem('xaverius_ai_analysis_result');
        setShowConfirmDelete(false);
        showCustomAlert("Seluruh database tanggapan survei berhasil dikosongkan.");
      };

      const controlManagementTable = useMemo(() => {
        const totalRes = stats.total;
        
        const q1Kurang = (stats.data && stats.data.q1) ? (stats.data.q1['Kurang Jelas'] || 0) : 0;
        const q1KurangPct = totalRes > 0 ? Math.round((q1Kurang / totalRes) * 100) : 0;
        
        const q6Tinggi = (stats.data && stats.data.q6) ? (stats.data.q6['Terlalu banyak and memberatkan anak'] || 0) : 0;
        const q6TinggiPct = totalRes > 0 ? Math.round((q6Tinggi / totalRes) * 100) : 0;

        return [
          {
            id: 1,
            aspect: "Kejelasan Penyampaian Materi Ajar",
            dataSupport: totalRes > 0 
              ? `${q1KurangPct}% responden menganggap cara mengajar guru kurang jelas.`
              : "Menunggu data survei pembelajaran masuk...",
            rootCause: totalRes > 0 
              ? "Guru kelas terlalu fokus pada materi tekstual dan minim visualisasi interaktif."
              : "Belum terdeteksi adanya akar masalah.",
            actions: totalRes > 0 
              ? "1. Mengadakan pelatihan pengembangan media ajar visual.\n2. Standardisasi silabus interaktif.\n3. Evaluasi pembelajaran bulanan oleh Koordinator Kurikulum."
              : "Kondisi Kondusif & Memuaskan.\n(Tidak diperlukan tindakan khusus saat ini)",
            pic: "Koordinator Kurikulum & Kepala Sekolah",
            deadline: "Desember 2025",
            status: totalRes > 0 ? "Sedang Berjalan" : "Kondusif"
          },
          {
            id: 2,
            aspect: "Beban Tugas Rumah (PR) Siswa",
            dataSupport: totalRes > 0 
              ? `${q6TinggiPct}% menilai beban tugas rumah terlalu berat dan menumpuk.`
              : "Menunggu data survei pembelajaran masuk...",
            rootCause: totalRes > 0 
              ? "Kurangnya koordinasi pemberian PR antarguru mata pelajaran dalam minggu yang sama."
              : "Belum terdeteksi adanya akar masalah.",
            actions: totalRes > 0 
              ? "1. Pembuatan jadwal terpusat untuk tugas rumah.\n2. Batasi PR maksimal 2 kali seminggu per siswa.\n3. Fokuskan PR pada pengayaan karakter mandiri."
              : "Kondisi Kondusif & Memuaskan.\n(Tidak diperlukan tindakan khusus saat ini)",
            pic: "Guru Kelas & Tim Konseling",
            deadline: "Oktober 2025",
            status: totalRes > 0 ? "Direncanakan" : "Kondusif"
          },
          {
            id: 3,
            aspect: "Higienitas Kantin & Fasilitas Sanitasi",
            dataSupport: totalRes > 0 
              ? "Aspirasi terekam dalam evaluasi kualitatif." 
              : "Menunggu pengisian saran tertulis.",
            rootCause: totalRes > 0 
              ? "Meningkatnya jumlah siswa aktif meningkatkan volume sampah harian."
              : "Belum ada masukan spesifik.",
            actions: totalRes > 0 
              ? "1. Pengadaan bak sampah tertutup organik & non-organik tambahan.\n2. Inspeksi kebersihan kantin mitra mingguan."
              : "Kebersihan Terawat.\n(Pemantauan berkala tetap berjalan)",
            pic: "Sarana Prasarana & Tim UKS",
            deadline: "September 2025",
            status: totalRes > 0 ? "Selesai" : "Kondusif"
          }
        ];
      }, [stats]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          
          {/* ================= BAGIAN WEB UTAMA ================= */}
          <div className={`${isOnScreenPrintPreview ? 'hidden' : 'print:hidden'} flex flex-col flex-1`}>
            
            {/* HEADER UTAMA */}
            <header className="bg-gradient-to-r from-blue-900 to-indigo-950 text-white shadow-xl sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                
                {/* Logo & Judul dengan Absolute Overlay System */}
                <div className="flex items-center gap-3">
                  <div className="bg-white p-1.5 rounded-xl shadow-lg border border-amber-400 flex items-center justify-center w-14 h-14 flex-shrink-0 relative overflow-hidden">
                    <img 
                      src="logo yxp6_2.jpg" 
                      alt="Logo" 
                      className="absolute inset-0 w-full h-full object-contain p-1.5 z-10" 
                      onError={(e) => {
                        e.target.style.display = 'none';
                      }}
                    />
                    <svg viewBox="0 0 100 110" className="w-full h-full text-blue-900" fill="currentColor">
                      <polygon points="50,5 92,36 77,93 23,93 8,36" fill="#1e3a8a" stroke="#fbbf24" strokeWidth="4"/>
                      <path d="M22,46 Q40,32 50,18 Q60,32 78,46 Q50,62 22,46" fill="#fbbf24" />
                      <path d="M32,68 Q50,63 50,76 Q50,63 68,68 L68,52 Q50,47 50,60 Q50,47 32,52 Z" fill="#ffffff" stroke="#1e3a8a" strokeWidth="2.5" />
                      <rect x="47" y="28" width="6" height="26" fill="#ffffff" />
                      <rect x="37" y="35" width="26" height="6" fill="#ffffff" />
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-lg md:text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-amber-300 bg-clip-text text-transparent">
                      SD XAVERIUS 2 JAMBI
                    </h1>
                    <p className="text-[10px] text-amber-400 font-semibold tracking-widest uppercase">
                      YAYASAN XAVERIUS PALEMBANG
                    </p>
                  </div>
                </div>

                {/* Navigasi Tab */}
                <div className="flex bg-blue-950/60 p-1.5 rounded-xl border border-blue-800/80 items-center gap-1">
                  <button
                    onClick={() => setActiveTab('survey')}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center gap-1.5 ${
                      activeTab === 'survey'
                        ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md'
                        : 'text-slate-300 hover:text-white hover:bg-white/10'
                    }`}
                  >
                    Formulir Survei
                  </button>
                  <button
                    onClick={() => setActiveTab('admin')}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center gap-1.5 ${
                      activeTab === 'admin'
                        ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md'
                        : 'text-slate-300 hover:text-white hover:bg-white/10'
                    }`}
                  >
                    Dashboard Admin
                  </button>
                </div>

              </div>
            </header>

            {/* BANNER UTAMA */}
            <section className="bg-gradient-to-b from-blue-950 to-blue-900 text-white py-12 px-4 text-center relative overflow-hidden">
              <div className="max-w-4xl mx-auto relative z-10">
                <h2 className="text-2xl md:text-4xl font-extrabold tracking-tight">
                  Survei Pembelajaran SD Xaverius 2 Jambi
                </h2>
                <p className="text-amber-400 text-lg md:text-xl font-bold mt-2 uppercase">
                  Tahun Ajaran 2025/2026
                </p>
              </div>
            </section>

            {/* KONTEN UTAMA */}
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
              
              {/* TAB 1: SURVEY */}
              {activeTab === 'survey' && (
                <div className="max-w-2xl mx-auto">
                  
                  {!currentParent ? (
                    <div className="bg-white rounded-3xl shadow-xl border p-8">
                      <div className="text-center mb-6">
                        <h3 className="text-2xl font-bold text-slate-900">Verifikasi Wali Murid</h3>
                        <p className="text-slate-500 text-xs mt-2">
                          Silakan pilih Kelas anak Bapak/Ibu terlebih dahulu untuk memulai kuesioner.
                        </p>
                      </div>

                      <form onSubmit={handleParentLogin} className="space-y-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-600 uppercase mb-1.5">PILIH KELAS ANAK</label>
                          <select
                            value={loginKelas}
                            onChange={(e) => setLoginKelas(e.target.value)}
                            className="w-full px-4 py-3 border-2 rounded-xl bg-white focus:border-blue-900 focus:outline-none text-sm font-semibold"
                          >
                            <option value="">-- Pilih Kelas Anak Anda --</option>
                            {STANDARD_CLASSES.map((kelas, idx) => (
                              <option key={idx} value={kelas}>{kelas}</option>
                            ))}
                          </select>
                        </div>

                        {loginError && <div className="p-3 bg-red-50 text-red-700 text-xs font-bold rounded-lg">{loginError}</div>}

                        <button type="submit" className="w-full bg-blue-900 hover:bg-indigo-950 text-white font-bold py-3.5 rounded-xl transition-all">
                          Masuk ke Kuesioner
                        </button>
                      </form>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      
                      {/* Bar Informasi Akun */}
                      <div className="bg-blue-900 text-white p-4 rounded-2xl shadow-md flex items-center justify-between animate-fade-in">
                        <div>
                          <p className="text-xs text-blue-200">Pembelajaran Kelas:</p>
                          <h4 className="text-sm font-bold">{currentParent.kelas}</h4>
                        </div>
                        <button onClick={handleParentLogout} className="text-xs text-amber-300 font-bold bg-white/10 px-3 py-1.5 rounded-lg">
                          Ganti Kelas
                        </button>
                      </div>

                      {!surveySubmitted ? (
                        <div className="bg-white rounded-3xl shadow-xl border overflow-hidden">
                          
                          {/* Progress bar */}
                          <div className="bg-slate-50 p-6 border-b">
                            <div className="flex justify-between text-xs font-bold text-slate-500 mb-2">
                              <span>Kemajuan Pengisian</span>
                              <span>{currentStep} / {totalSteps}</span>
                            </div>
                            <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                              <div className="bg-blue-900 h-full transition-all" style={{ width: `${(currentStep / totalSteps) * 100}%` }} />
                            </div>
                          </div>

                          {/* Detail Pertanyaan */}
                          <div className="p-8">
                            {questions.map((q) => {
                              if (q.id !== currentStep) return null;
                              return (
                                <div key={q.id} className="animate-fade-in">
                                  <h3 className="text-lg md:text-xl font-bold mb-6 text-slate-900">{q.id}. {q.title}</h3>
                                  
                                  {q.type === 'radio' && q.options && (
                                    <div className="space-y-3">
                                      {q.options.map((opt, idx) => (
                                        <label key={idx} className="flex items-center gap-3 p-4 border rounded-xl cursor-pointer hover:bg-slate-50">
                                          <input
                                            type="radio"
                                            name={q.key}
                                            checked={formData[q.key] === opt}
                                            onChange={() => handleRadioChange(q.key, opt)}
                                            className="h-4 w-4"
                                          />
                                          <span className="text-sm font-medium">{opt}</span>
                                        </label>
                                      ))}
                                    </div>
                                  )}

                                  {q.type === 'checkbox' && q.options && (
                                    <div className="space-y-3">
                                      <p className="text-xs text-amber-600 mb-2 font-semibold">Maksimal pilih {q.maxOptions || 2} pilihan.</p>
                                      {q.options.map((opt, idx) => (
                                        <label key={idx} className="flex items-center gap-3 p-4 border rounded-xl cursor-pointer hover:bg-slate-50">
                                          <input
                                            type="checkbox"
                                            checked={(formData[q.key] || []).includes(opt)}
                                            onChange={() => handleCheckboxChange(q.key, opt, q.maxOptions || 2)}
                                            className="h-4 w-4"
                                          />
                                          <span className="text-sm font-medium">{opt}</span>
                                        </label>
                                      ))}
                                    </div>
                                  )}

                                  {q.type === 'textarea' && (
                                    <textarea
                                      rows={5}
                                      value={formData[q.key] || ''}
                                      onChange={(e) => handleTextChange(q.key, e.target.value)}
                                      placeholder="Tuliskan aspirasi, harapan belajar, atau masukan membangun Anda untuk kemajuan proses pembelajaran anak..."
                                      className="w-full p-4 border-2 rounded-xl focus:border-blue-900 focus:outline-none"
                                    />
                                  )}
                                </div>
                              );
                            })}

                            {validationError && <div className="mt-4 p-3 bg-red-50 text-red-700 text-xs font-bold rounded-lg">{validationError}</div>}
                          </div>

                          {/* Navigasi Wizard */}
                          <div className="bg-slate-50 p-6 border-t flex justify-between">
                            <button onClick={handlePrev} disabled={currentStep === 1} className="px-4 py-2 text-slate-600 font-bold hover:bg-slate-100 rounded-lg">
                              Kembali
                            </button>

                            {currentStep < totalSteps ? (
                              <button onClick={handleNext} className="bg-blue-900 text-white px-6 py-2 rounded-lg font-bold">
                                Selanjutnya
                              </button>
                            ) : (
                              <button onClick={handleSubmitSurvey} className="bg-amber-500 text-slate-950 px-6 py-2 rounded-lg font-black">
                                Kirim Survei
                              </button>
                            )}
                          </div>

                        </div>
                      ) : (
                        <div className="bg-white p-8 rounded-3xl border text-center space-y-4 animate-scale-up">
                          <h3 className="text-2xl font-bold text-emerald-700">Tanggapan Terkirim!</h3>
                          <p className="text-slate-600 text-sm font-medium">Terima kasih atas bantuan, evaluasi, dan kerja sama berharga yang Bapak/Ibu berikan.</p>
                          <button onClick={handleParentLogout} className="bg-blue-900 text-white px-6 py-2 rounded-lg font-bold">
                            Selesai & Keluar
                          </button>
                        </div>
                      )}

                    </div>
                  )}

                </div>
              )}

              {/* TAB 2: ADMIN */}
              {activeTab === 'admin' && (
                <div className="space-y-6">
                  
                  {!isAdminUnlocked ? (
                    <div className="max-w-md mx-auto bg-white p-8 rounded-3xl border">
                      <h3 className="text-xl font-bold text-center mb-4">Akses Keamanan Admin</h3>
                      <form onSubmit={handleAdminAccess} className="space-y-4">
                        <input
                          type="password"
                          placeholder="Ketik PIN Admin..."
                          value={passcode}
                          onChange={(e) => setPasscode(e.target.value)}
                          className="w-full text-center text-2xl py-2 border-2 rounded-xl"
                        />
                        {passcodeError && <div className="text-red-600 text-xs text-center font-bold">{passcodeError}</div>}
                        <button type="submit" className="w-full bg-blue-900 text-white py-3 rounded-xl font-bold">
                          Buka Dashboard
                        </button>
                      </form>
                    </div>
                  ) : (
                    <div className="space-y-6 animate-fade-in">
                      
                      {/* Menu Panel */}
                      <div className="bg-white p-4 rounded-xl border flex flex-wrap justify-between items-center gap-4">
                        <div className="flex flex-wrap gap-2">
                          <button onClick={() => setAdminSubTab('statistics')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${adminSubTab === 'statistics' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            Statistik
                          </button>
                          <button onClick={() => setAdminSubTab('control_management')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${adminSubTab === 'control_management' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            Matriks Perbaikan
                          </button>
                          <button onClick={() => setAdminSubTab('school_development')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${adminSubTab === 'school_development' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            Program Peningkatan Mutu ⭐
                          </button>
                          <button onClick={() => setAdminSubTab('raw_comments')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${adminSubTab === 'raw_comments' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            Katalog Aspirasi
                          </button>
                          <button onClick={() => setAdminSubTab('manage_questions')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${adminSubTab === 'manage_questions' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            Kelola Pertanyaan
                          </button>
                          <button onClick={() => setAdminSubTab('settings')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${adminSubTab === 'settings' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            Pengaturan & Keamanan
                          </button>
                        </div>
                        <button onClick={handleLogoutAdmin} className="text-xs text-red-600 font-bold hover:underline">
                          Kunci Dashboard
                        </button>
                      </div>

                      {/* STATISTIK */}
                      {adminSubTab === 'statistics' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {questions.filter(q => q.type !== 'textarea').map((q) => {
                            const chartData = stats.data[q.key] || {};
                            const maxVote = Math.max(...Object.values(chartData), 1);
                            return (
                              <div key={q.id} className="bg-white p-6 rounded-xl border shadow-sm">
                                <h4 className="text-sm font-bold mb-4">{q.id}. {q.title}</h4>
                                <div className="space-y-3">
                                  {q.options && q.options.map((opt, idx) => {
                                    const votes = chartData[opt] || 0;
                                    const percentage = stats.total > 0 ? (votes / stats.total) * 100 : 0;
                                    return (
                                      <div key={idx} className="space-y-1">
                                        <div className="flex justify-between text-xs font-semibold">
                                          <span className="max-w-[70%] truncate">{opt}</span>
                                          <span>{votes} ({percentage.toFixed(0)}%)</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                          <div className="bg-blue-900 h-full transition-all duration-1000" style={{ width: `${(votes/maxVote)*100}%` }} />
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* KONTROL PERBAIKAN */}
                      {adminSubTab === 'control_management' && (
                        <div className="space-y-6">
                          <div className="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-6 rounded-xl flex flex-wrap justify-between items-center gap-4">
                            <div>
                              <h4 className="font-bold text-lg">Matriks & Rencana Tindak Lanjut</h4>
                              <p className="text-xs text-slate-300 mt-1">Kosongkan hasil survei atau pratinjau dokumen rilis fisik A4 sekolah.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                              <button onClick={() => setIsOnScreenPrintPreview(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all">
                                👁️ Pratinjau Lembar A4
                              </button>
                              
                              <button onClick={() => setShowConfirmDelete(true)} className="bg-red-600 hover:bg-red-750 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-md">
                                Kosongkan Database Survei
                              </button>
                            </div>
                          </div>

                          <div className="bg-white rounded-xl border overflow-hidden shadow-sm">
                            <div className="overflow-x-auto">
                              <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                  <tr className="bg-slate-50 border-b">
                                    <th className="p-3 text-center w-12">No</th>
                                    <th className="p-3">Aspek</th>
                                    <th className="p-3">Data Pendukung</th>
                                    <th className="p-3">Tindakan Perbaikan</th>
                                    <th className="p-3">PIC</th>
                                    <th className="p-3 text-center">Status</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {controlManagementTable.map((row, idx) => (
                                    <tr key={row.id} className="border-b hover:bg-slate-50/50">
                                      <td className="p-3 font-bold text-slate-500 text-center">{idx + 1}</td>
                                      <td className="p-3 font-bold">{row.aspect}</td>
                                      <td className="p-3 text-slate-600 font-semibold">{row.dataSupport}</td>
                                      <td className="p-3 whitespace-pre-line bg-amber-50/10 font-medium">{row.actions}</td>
                                      <td className="p-3 font-semibold text-slate-700">{row.pic}</td>
                                      <td className="p-3 text-center">
                                        <span className={`px-2 py-0.5 rounded-full font-bold ${
                                          row.status === 'Kondusif' 
                                            ? 'bg-green-100 text-green-800' 
                                            : row.status === 'Selesai' 
                                              ? 'bg-emerald-100 text-emerald-800'
                                              : 'bg-amber-100 text-amber-800'
                                        }`}>{row.status}</span>
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* PROGRAM PENINGKATAN MUTU / KEMAJUAN SEKOLAH */}
                      {adminSubTab === 'school_development' && (
                        <div className="space-y-6 animate-fade-in">
                          <div className="bg-gradient-to-r from-emerald-800 to-teal-950 text-white p-6 rounded-2xl shadow-sm">
                            <h4 className="font-bold text-lg">💡 Kesimpulan & Program Kegiatan Memajukan Sekolah</h4>
                            <p className="text-xs text-emerald-100 mt-1 leading-relaxed">
                              Rumusan rekomendasi strategis jangka panjang berdasarkan data evaluasi pembelajaran wali murid SD Xaverius 2 Jambi.
                            </p>
                          </div>

                          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* BLOK KESIMPULAN */}
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 lg:col-span-1">
                              <h4 className="font-extrabold text-slate-900 text-sm border-b pb-2 text-blue-900 uppercase">
                                📌 KESIMPULAN UTAMA EVALUASI
                              </h4>
                              <div className="space-y-3.5 text-xs text-slate-700 leading-relaxed">
                                <div className="p-3 bg-slate-50 rounded-lg">
                                  <strong className="text-slate-900 block mb-1">1. Kejelasan & Metode Ajar</strong>
                                  Penyampaian materi pembelajaran dinilai cukup baik secara teoritis, namun membutuhkan peningkatan signifikan dalam hal penggunaan media visual digital interaktif agar anak-anak tidak mudah bosan.
                                </div>
                                <div className="p-3 bg-slate-50 rounded-lg">
                                  <strong className="text-slate-900 block mb-1">2. Kontrol Tugas Sekolah (PR)</strong>
                                  Sebagian wali murid masih merasa volume PR di hari-hari tertentu terlalu padat akibat minimnya koordinasi lintas guru mata pelajaran. Agenda tugas terpadu mutlak diperlukan.
                                </div>
                                <div className="p-3 bg-slate-50 rounded-lg">
                                  <strong className="text-slate-900 block mb-1">3. Karakter Positif & Moral</strong>
                                  SD Xaverius 2 Jambi dinilai sukses membangun moralitas Kristiani yang luhur. Untuk itu, program pembiasaan positif di sekolah harus diselaraskan secara intensif dengan pembiasaan di rumah.
                                </div>
                              </div>
                            </div>

                            {/* BLOK PROGRAM KEGIATAN */}
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 lg:col-span-2">
                              <h4 className="font-extrabold text-slate-900 text-sm border-b pb-2 text-emerald-800 uppercase flex items-center justify-between">
                                <span>🚀 PROGRAM KEGIATAN STRATEGIS SEKOLAH</span>
                                <span className="text-[10px] text-slate-400 font-normal">Klik tombol bintang untuk rancang detail kerja dengan AI</span>
                              </h4>
                              <div className="space-y-4 text-xs text-slate-700 leading-relaxed">
                                
                                <div className="p-4 bg-emerald-50/50 border-l-4 border-emerald-500 rounded-r-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                  <div className="flex-1">
                                    <strong className="text-emerald-950 block mb-0.5">Xaverius Smart Classroom (SMC)</strong>
                                    <p className="text-slate-600 mb-1">Penyediaan fasilitas proyektor multimedia, alat peraga visual di setiap ruang kelas, serta pelatihan metodologi ajar kreatif berbasis gamifikasi bagi guru kelas.</p>
                                    <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100/80 px-2 py-0.5 rounded">Sasaran: Guru & Fasilitas</span>
                                  </div>
                                  <button 
                                    onClick={() => handleGenerateProgramImplementation("Xaverius Smart Classroom (SMC)", "Penyediaan fasilitas proyektor multimedia, alat peraga visual, dan pelatihan gamifikasi mengajar bagi guru.")}
                                    disabled={isAiGeneratingProgram}
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] px-3 py-1.5 rounded-lg shadow-sm transition-all flex items-center gap-1 flex-shrink-0"
                                  >
                                    ✨ Rancang Program Detail
                                  </button>
                                </div>

                                <div className="p-4 bg-amber-50/50 border-l-4 border-amber-500 rounded-r-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                  <div className="flex-1">
                                    <strong className="text-amber-950 block mb-0.5">Agenda PR Terpadu & Mandiri (HAP)</strong>
                                    <p className="text-slate-600 mb-1">Implementasi kalender bersama di setiap ruang kelas, membatasi tugas rumah agar maksimal hanya 2 mata pelajaran per minggu dengan fokus pengayaan moral.</p>

                <div className="flex gap-2 justify-center">
                  <button onClick={handleClearAllResponses} className="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-red-700 transition-all">Ya, Hapus</button>
                  <button onClick={() => setShowConfirmDelete(false)} className="bg-slate-200 text-slate-800 text-xs font-bold px-4 py-2 rounded-lg hover:bg-slate-300 transition-all">Batal</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
